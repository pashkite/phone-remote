name: Build and test Android APK

on:
  pull_request:
    paths:
      - "android-client/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  build-and-device-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compile, unit test, and build unsigned packages
        working-directory: android-client
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 16 screen-projection smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          working-directory: android-client
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: >-
            bash -c 'adb logcat -c; test_status=0; gradle :app:connectedDebugAndroidTest --stacktrace || test_status=$?; adb logcat -d -b all -v threadtime > android16-logcat.txt 2>&1 || true; adb shell dumpsys activity exit-info com.galaxyremote.app > android16-exit-info.txt 2>&1 || true; adb shell dumpsys dropbox --print data_app_crash > android16-app-crashes.txt 2>&1 || true; exit "$test_status"'

      - name: Upload device-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: galaxy-remote-android16-test-reports
          path: |
            android-client/app/build/reports/androidTests/connected/
            android-client/app/build/outputs/androidTest-results/connected/
            android-client/android16-logcat.txt
            android-client/android16-exit-info.txt
            android-client/android16-app-crashes.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Collect Android signing tools
        shell: bash
        run: |
          latest="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -n "$latest"
          mkdir -p android-signing-tools/lib
          cp "$latest/zipalign" android-signing-tools/
          cp "$latest/lib/apksigner.jar" android-signing-tools/lib/

      - uses: actions/upload-artifact@v4
        with:
          name: galaxy-remote-apk-build
          path: |
            android-client/app/build/outputs/apk/debug/app-debug.apk
            android-client/app/build/outputs/apk/release/app-release-unsigned.apk
            android-client/app/build/outputs/bundle/release/app-release.aab
            android-signing-tools/
          if-no-files-found: error
          retention-days: 1
